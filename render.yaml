services:
  - type: web
    name: digital-addiction-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digital-addiction-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: "*"
      - key: PYTHON_VERSION
        value: 3.9.0

databases:
  - name: digital-addiction-db
    databaseName: digital_addiction
    user: digital_user
